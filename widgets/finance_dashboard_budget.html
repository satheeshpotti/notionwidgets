<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Dashboard Budget</title><script src="embedded-data.js"></script><script src="config.js"></script><style>
:root{--ink:#132338;--muted:#64748b;--mint:#D9FFF5;--aqua:#C6F4FA;--lav:#E8E6FF;--green:#70D69B;--yellow:#E8BF3F;--red:#EF6F7B;--blue:#5AA7F7;--purple:#9B8CFF;--white:rgba(255,255,255,.74);--line:rgba(151,185,211,.55);--shadow:0 18px 44px rgba(90,116,150,.14)}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink)}.shell{border-radius:28px;border:1px solid var(--line);background:linear-gradient(135deg,var(--mint),var(--aqua) 52%,var(--lav));box-shadow:var(--shadow);padding:18px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:14px}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:950;color:#54718f}.title{font-size:28px;font-weight:950;letter-spacing:-.05em;line-height:1.05}.status,.mini,.debug{font-size:12px;color:var(--muted);line-height:1.35}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr);margin-top:14px}.main{grid-template-columns:1.05fr 1fr 1.2fr;margin-top:12px}.trackers{grid-template-columns:repeat(5,1fr);margin-top:12px}.three{grid-template-columns:repeat(3,1fr);margin-top:12px}.two{grid-template-columns:repeat(2,1fr);margin-top:12px}.reports{grid-template-columns:repeat(3,1fr);margin-top:12px}.card{background:var(--white);border:1px solid rgba(151,185,211,.45);border-radius:18px;padding:13px;backdrop-filter:blur(12px)}.click{cursor:pointer;transition:.15s}.click:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(90,116,150,.10)}.label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.value{font-size:22px;font-weight:950;letter-spacing:-.03em}.section{font-size:15px;font-weight:950;margin-bottom:8px}.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button,.btn{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.78);font-weight:850;color:var(--ink);cursor:pointer}button.primary,.btn.primary{background </style></head><body><script>window.PAGE_KIND="budget";</script><div class="shell"><div class="top"><div><div class="kicker">Finance Dashboard Section</div><div class="title">Budget Health</div><div id="status" class="status"></div><div id="debug" class="debug"></div></div><button class="primary" onclick="printPDF()">Generate PDF / Print Report</button></div><div class="card" style="margin-top:12px"><div class="section">Budget health</div><div id="bud"></div></div></div><script>
let DATA={},SOURCE='',LOAD_NOTES=[],planner='spend',RANGE=12;const T=['Settings','Categories','Accounts','Transactions','Budgets','Recurring','Debts','Goals','Subscriptions','Wishlist','Bills','Orders','NoSpend'],$=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),COL=['#70D69B','#E8BF3F','#EF6F7B','#5AA7F7','#9B8CFF','#70c7d6','#ff9f80'];function n(x){let v=parseFloat(String(x??0).replace(/[$,%]/g,''));return isNaN(v)?0:v}function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function val(k){let r=(DATA.Settings||[]).find(x=>String(x.setting_key||x.key).trim()==k);return r?String(r.setting_value??r.value):''}function url(k){return val(k)||'#'}function fmt(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:val('currency')||'USD',maximumFractionDigits:0}).format(v||0)}function pct(v){return(v||0).toFixed(1)+'%'}function parseCSV(s){let r=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i],nx=s[i+1];if(c=='"'&&q&&nx=='"'){v+='"';i++}else if(c=='"')q=!q;else if(c==','&&!q){row.push(v);v=''}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&nx=='\n')i++;row.push(v);if(row.some(x=>x!==''))r.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x!==''))r.push(row);let h=r.shift()||[];return r.map(a=>Object.fromEntries(h.map((x,i)=>[x,a[i]??''])))}function sheetId(){let p=new URLSearchParams(location.search);let q=p.get('sheetId')||p.get('sheet')||'';let stored='';try{stored=localStorage.getItem('FINANCE_SHEET_ID')||''}catch(e){}return q||((window.FINANCE_CONFIG||{}).useLocalSetup?stored:'')||(window.FINANCE_CONFIG||{}).sheetId||''}function gvizUrl(id,tab){return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`}async function loadSheetId(){let id=sheetId(),o={},notes=[];if(!id){DATA=window.EMBEDDED_FINANCE_DATA||{};SOURCE='embedded demo data - no Sheet ID';LOAD_NOTES=['No Google Sheet ID found. Use setup widget or ?sheetId=...'];render();return}for(const t of T){let u=gvizUrl(id,t);try{let res=await fetch(u+'&v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let txt=await res.text();if(txt.trim().startsWith('<'))throw Error('not CSV');o[t]=parseCSV(txt);notes.push(t+': live')}catch(e){o[t]=(window.EMBEDDED_FINANCE_DATA&&window.EMBEDDED_FINANCE_DATA[t])||[];notes.push(t+': fallback '+e.message)}}DATA=o;SOURCE='Google Sheet ID '+id.slice(0,8)+'...; '+notes.filter(x=>x.includes('fallback')).length+' fallback table(s)';LOAD_NOTES=notes;render()}function init(){try{loadSheetId();let m=+(window.FINANCE_CONFIG?.autoRefreshMinutes||0);if(m>0)setInterval(loadSheetId,m*60000)}catch(e){document.body.innerHTML='<pre>'+esc(e.message)+'</pre>'}}function tx(){return(DATA.Transactions||[]).map(t=>({...t,amount:n(t.amount),date:new Date(t.date)})).filter(t=>!isNaN(t.date))}function cur(){return val('current_month')||new Date().toISOString().slice(0,7)}function mtx(m=cur()){return tx().filter(t=>t.date.toISOString().slice(0,7)==m)}function mons(k=RANGE){return[...new Set(tx().map(t=>t.date.toISOString().slice(0,7)))].sort().slice(-k)}function inc(l){return l.filter(t=>t.amount>0&&t.type==='income').reduce((a,b)=>a+b.amount,0)}function exp(l){return Math.abs(l.filter(t=>t.amount<0&&t.type==='expense').reduce((a,b)=>a+b.amount,0))}function sav(l){return Math.abs(l.filter(t=>['savings','investment'].includes(t.type)).reduce((a,b)=>a+b.amount,0))}function nw(){return(DATA.Accounts||[]).reduce((a,b)=>a+n(b.starting_balance),0)+tx().reduce((a,b)=>a+b.amount,0)}function cash(){return(DATA.Accounts||[]).filter(a=>['checking','savings'].includes(a.dashboard_type)).reduce((a,b)=>a+n(b.starting_balance),0)}function credit(){let c=(DATA.Accounts||[]).filter(a=>a.dashboard_type==='credit');return{u:Math.abs(c.reduce((a,b)=>a+n(b.starting_balance),0)),l:c.reduce((a,b)=>a+n(b.credit_limit),0)}}function by(l,k='category'){let o={};l.filter(t=>t.amount<0&&t.type==='expense').forEach(t=>o[t[k]||'Other']=(o[t[k]||'Other']||0)+Math.abs(t.amount));return o}function pred(c){let o={};tx().filter(t=>t.category==c&&t.type==='expense').forEach(t=>{let m=t.date.toISOString().slice(0,7);o[m]=(o[m]||0)+Math.abs(t.amount)});let v=Object.values(o).slice(-6);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}function tip(h,x,y){let e=$('#tip');if(!e)return;e.innerHTML=h;e.style.display='block';e.style.left=x+12+'px';e.style.top=y+12+'px'}function untip(){let e=$('#tip');if(e)e.style.display='none'}function go(u){if(u&&u!='#')window.open(u,'_blank')}function cap(k){go(url('quick_capture_'+k+'_url'))}function lineSvg(values,labels,target){let w=420,h=190,p=28,mx=Math.max(...values,1),mn=Math.min(...values,0);if(mx==mn)mx++;let pts=values.map((v,i)=>[p+i*(w-2*p)/(values.length-1||1),h-p-(v-mn)*(h-2*p)/(mx-mn)]);return `<svg viewBox="0 0 ${w} ${h}" onclick="go('${target}')"><polyline fill="none" stroke="#5AA7F7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(x=>x.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#70D69B"><title>${labels[i]} ${fmt(values[i])}</title></circle>`).join('')}</svg>`}function barSvg(obj,target){let en=Array.isArray(obj)?obj:Object.entries(obj),w=420,h=190,p=28,mx=Math.max(...en.map(x=>Math.abs(x[1])),1);return `<svg viewBox="0 0 ${w} ${h}" onclick="go('${target}')">`+en.slice(0,7).map((x,i)=>{let bw=(w-2*p)/Math.max(en.length,1)-8,xx=p+i*((w-2*p)/Math.max(en.length,1)),bh=(h-55)*Math.abs(x[1])/mx;return `<rect x="${xx}" y="${h-35-bh}" width="${bw}" height="${bh}" rx="8" fill="${COL[i%COL.length]}"><title>${esc(x[0])} ${fmt(x[1])}</title></rect><text x="${xx}" y="${h-10}" font-size="9" fill="#64748b">${esc(String(x[0]).slice(0,9))}</text>`}).join('')+'</svg>'}function donutSvg(obj,target){let en=Object.entries(obj).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,7),tot=en.reduce((a,b)=>a+b[1],0)||1,r=55,c=2*Math.PI*r,off=0;let arcs=en.map((x,i)=>{let len=x[1]/tot*c,a=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${COL[i%COL.length]}" stroke-width="20" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(x[0])} ${fmt(x[1])}</title></circle>`;off+=len;return a}).join('');let leg=en.map((x,i)=>`<div><span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${COL[i%COL.length]}"></span> ${esc(x[0])} ${pct(x[1]/tot*100)}</div>`).join('');return `<svg viewBox="0 0 420 190" onclick="go('${target}')">${arcs}<circle cx="90" cy="90" r="35" fill="rgba(255,255,255,.88)"/><text x="90" y="95" text-anchor="middle" font-size="13" font-weight="900">${fmt(tot)}</text><foreignObject x="170" y="25" width="220" height="135"><div style="font-size:11px;color:#64748b">${leg}</div></foreignObject></svg>`}function tableRows(items){return '<table>'+items.map(t=>`<tr><td>${t.date instanceof Date?t.date.toISOString().slice(5,10):''}</td><td>${esc(t.merchant||'')}</td><td>${esc(t.category||'')}</td><td><b>${fmt(t.amount)}</b></td></tr>`).join('')+'</table>'}function setHeader(){if($('#name'))$('#name').textContent=(val('user_name')||'there').split(' ')[0];if($('#mon'))$('#mon').textContent=new Date(cur()+'-01').toLocaleString('en-US',{month:'long',year:'numeric'});if($('#status'))$('#status').textContent='Source: '+SOURCE+'; '+new Date().toLocaleTimeString();if($('#debug'))$('#debug').innerHTML=LOAD_NOTES.slice(0,8).map(esc).join(' | ')}function renderMain(){setHeader();let l=mtx(),i=inc(l),e=exp(l),s=sav(l),cf=i-e-s,ms=mons(8),grp=by(l,'group'),cat=by(l),cr=credit();$('#nw').textContent=fmt(nw());$('#cf').textContent=fmt(cf);$('#sr').textContent=pct(i?s/i*100:0);let avg=mons(6).map(m=>exp(mtx(m))).reduce((a,b)=>a+b,0)/Math.max(1,mons(6).length);$('#run').textContent=(cash()/(avg||1)).toFixed(1)+' mo';let top=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0]||['None',0],bills=(DATA.Bills||[]).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)),util=cr.l?cr.u/cr.l*100:0;$('#prior').innerHTML=`<div class="priority-grid"><div class="note"><b>Today</b><br>${esc(bills[0]?.bill||'Review')} ${fmt(n(bills[0]?.amount))}</div><div class="note"><b>This week</b><br>Review ${(DATA.Subscriptions||[]).filter(x=>x.decision==='review').length} subscriptions.</div><div class="note"><b>This month</b><br>Top spend ${esc(top[0])} ${fmt(top[1])}</div><div class="note"><b>Planner insight</b><br>Credit ${pct(util)}; runway ${(cash()/(avg||1)).toFixed(1)} mo.</div><div class="note"><b>Action</b><br>${cf>0?'Route surplus to goals.':'Reduce variable spend.'}</div><div class="note"><b>Watchlist</b><br>${util>30?'Credit above 30%.':'Credit healthy.'}</div></div>`;$('#advisor').innerHTML='<b>AI advisor:</b> '+(e>i*.7?'Expense load is high; pause discretionary spend.':'Cash flow profile is healthy.');if(planner==='cash')$('#plannerChart').innerHTML=lineSvg(ms.map(m=>inc(mtx(m))-exp(mtx(m))-sav(mtx(m))),ms,url('transactions_url'));if(planner==='spend')$('#plannerChart').innerHTML=donutSvg(grp,url('transactions_url'));if(planner==='goals')$('#plannerChart').innerHTML=barSvg((DATA.Goals||[]).map(g=>[g.goal_name,n(g.current_amount)/Math.max(1,n(g.target_amount))*100]),url('goals_url'));let tips={'Money Hub':(DATA.Accounts||[]).map(a=>`${esc(a.account_name)}: <b>${fmt(n(a.starting_balance))}</b>`).join('<br>'),'Savings Tracker':(DATA.Goals||[]).map(g=>`${esc(g.goal_name)}: ${fmt(n(g.current_amount))}/${fmt(n(g.target_amount))}`).join('<br>'),'Bill Tracker':(DATA.Bills||[]).map(b=>`${esc(b.due_date)} ${esc(b.bill)}: <b>${fmt(n(b.amount))}</b>`).join('<br>'),'Debt Tracker':(DATA.Debts||[]).map(d=>`${esc(d.debt_name)}: ${fmt(n(d.balance))} at ${esc(d.apr_pct)}%`).join('<br>'),'Expense Tracker':tx().filter(t=>t.type==='expense').slice(-5).map(t=>`${esc(t.merchant)}: ${fmt(Math.abs(t.amount))}`).join('<br>'),'No Spend Tracker':(DATA.NoSpend||[]).map(x=>`${esc(x.category)}: ${esc(x.success_days)}/${esc(x.target_days)} days`).join('<br>'),'Subscriptions Tracker':(DATA.Subscriptions||[]).map(x=>`${esc(x.subscription)}: ${fmt(n(x.monthly_cost))} · ${esc(x.decision)}`).join('<br>'),'Wish List':(DATA.Wishlist||[]).map(x=>`${esc(x.item)}: ${fmt(n(x.estimated_cost))}`).join('<br>'),'Order Tracker':(DATA.Orders||[]).map(x=>`${esc(x.order)}: ${esc(x.status)}`).join('<br>')};let cards=[['Money Hub',fmt(nw()),url('accounts_url')],['Savings Tracker',fmt((DATA.Goals||[]).reduce((a,b)=>a+n(b.current_amount),0)),url('goals_url')],['Bill Tracker',(DATA.Bills||[]).length+' bills',url('bills_url')],['Debt Tracker',fmt((DATA.Debts||[]).reduce((a,b)=>a+n(b.balance),0)),url('debt_url')],['Expense Tracker',fmt(e),url('transactions_url')],['No Spend Tracker',(DATA.NoSpend||[])[0]?.success_days+'/'+(DATA.NoSpend||[])[0]?.target_days,url('nospend_url')],['Subscriptions Tracker',fmt((DATA.Subscriptions||[]).filter(x=>x.status==='active').reduce((a,b)=>a+n(b.monthly_cost),0)),url('subscriptions_url')],['Wish List',(DATA.Wishlist||[]).length+' wishes',url('wishlist_url')],['Order Tracker',(DATA.Orders||[]).length+' orders',url('orders_url')]];$('#trackers').innerHTML=cards.map(c=>`<div class="card click tracker" data-k="${esc(c[0])}" data-u="${esc(c[2])}"><div class="label">${esc(c[0])}</div><div class="value" style="font-size:18px">${esc(c[1])}</div><div class="mini">Open details</div></div>`).join('');$$('.tracker').forEach(x=>{x.onmousemove=ev=>tip('<b>'+x.dataset.k+'</b><br>'+(tips[x.dataset.k]||''),ev.clientX,ev.clientY);x.onmouseleave=untip;x.onclick=()=>go(x.dataset.u)})}function renderBudget(){setHeader();let l=mtx(),cat=by(l);$('#bud').innerHTML=(DATA.Budgets||[]).map(b=>{let u=cat[b.category]||0,r=u/(n(b.monthly_budget)||1);return`<b>${esc(b.category)}</b> <span class="mini">${fmt(u)} / ${fmt(n(b.monthly_budget))}; next ${fmt(pred(b.category))}</span><div class="barline"><div class="fill" style="width:${Math.min(100,r*100)}%;background:${r>.95?'#EF6F7B':r>.8?'#E8BF3F':'#70D69B'}"></div></div>`}).join('')}function renderCredit(){setHeader();let cr=credit();$('#creditChart').innerHTML=donutSvg({'Credit used':cr.u,'Available credit':Math.max(0,cr.l-cr.u)},url('transactions_url'));$('#credRows').innerHTML=tableRows(tx().filter(t=>['Chase Sapphire','Amex Blue Cash'].includes(t.account)&&t.type==='expense').slice(-8))}function renderTransactions(){setHeader();$('#recent').innerHTML=tableRows(tx().sort((a,b)=>b.date-a.date).slice(0,18))}function renderReports(part){setHeader();let ms=mons(RANGE),cat=by(mtx()),grp=by(mtx(),'group'),cr=credit(),all=[['Net worth trend','line',ms,ms.map((m,i)=>nw()-(ms.length-i)*1200),url('accounts_url')],['Monthly income','line',ms,ms.map(m=>inc(mtx(m))),url('transactions_url')],['Monthly expenses','line',ms,ms.map(m=>exp(mtx(m))),url('transactions_url')],['Cash flow trend','line',ms,ms.map(m=>inc(mtx(m))-exp(mtx(m))-sav(mtx(m))),url('transactions_url')],['Spending by category','doughnut',Object.keys(cat),Object.values(cat),url('transactions_url')],['Spending by group','doughnut',Object.keys(grp),Object.values(grp),url('transactions_url')],['Top expense bars','bar',Object.keys(cat),Object.values(cat),url('transactions_url')],['Budget variance','bar',(DATA.Budgets||[]).map(b=>b.category),(DATA.Budgets||[]).map(b=>(cat[b.category]||0)-n(b.monthly_budget)),url('budgets_url')],['Budget prediction','bar',(DATA.Budgets||[]).map(b=>b.category),(DATA.Budgets||[]).map(b=>pred(b.category)),url('budgets_url')],['Debt balances','bar',(DATA.Debts||[]).map(d=>d.debt_name),(DATA.Debts||[]).map(d=>n(d.balance)),url('debt_url')],['Goal progress %','bar',(DATA.Goals||[]).map(g=>g.goal_name),(DATA.Goals||[]).map(g=>n(g.current_amount)/Math.max(1,n(g.target_amount))*100),url('goals_url')],['Subscription burn','bar',(DATA.Subscriptions||[]).map(s=>s.subscription),(DATA.Subscriptions||[]).map(s=>n(s.monthly_cost)),url('subscriptions_url')],['Credit utilization','doughnut',['Credit used','Available'],[cr.u,Math.max(0,cr.l-cr.u)],url('transactions_url')],['Anomaly watch','table',[],tx().filter(t=>t.type==='
