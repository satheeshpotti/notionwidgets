<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<style>
body{font-family:Inter;background:linear-gradient(135deg,#D9FFF5,#C6F4FA,#E8E6FF);margin:0;padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:15px}
.card{background:white;padding:15px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.modules{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:15px}
.module{background:white;padding:12px;border-radius:12px;position:relative}
.module:hover .hover{display:block}
.hover{display:none;position:absolute;background:#fff;border:1px solid #ccc;padding:10px;top:100%;left:0}
svg{width:100%;height:160px}
</style>
</head>
<body>
<div id='app'>Loading dashboard...</div>
<script src='app.js'></script>
</body>
</html>
