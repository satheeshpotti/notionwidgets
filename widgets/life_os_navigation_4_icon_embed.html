<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Life OS Navigation</title>
<style>
:root { --mint:#BDF3E7; --aqua:#77DDE7; --sky:#9DBAF4; --lavender:#D8D2FF; --ink:#102033; --muted:#5F7892; --gold:#E3BE4F; --soft:#F7FCFF; }
* { box-sizing:border-box; }
body { margin:0; background:transparent; font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; color:var(--ink); }
.life-os { padding:10px; }
.header { display:flex; align-items:center; justify-content:space-between; margin:0 0 14px; }
.kicker { font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:850; color:var(--muted); }
.title { font-size:26px; font-weight:900; letter-spacing:-.03em; margin-top:2px; }
.header-line { width:38%; height:5px; border-radius:999px; background:linear-gradient(90deg,var(--aqua),var(--sky),var(--lavender)); opacity:.7; }
.grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:16px; }
.nav-card { min-height:152px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; position:relative; overflow:hidden; padding:20px; border-radius:28px; text-decoration:none; color:var(--ink); background:linear-gradient(135deg, rgba(189,243,231,.78), rgba(255,255,255,.92) 45%, rgba(216,210,255,.72)); border:1px solid rgba(157,186,244,.46); box-shadow:0 16px 36px rgba(42,75,110,.13); }
.nav-card:before { content:""; position:absolute; inset:-40px; background:radial-gradient(circle at 18% 20%, rgba(119,221,231,.38), transparent 27%), radial-gradient(circle at 88% 12%, rgba(227,190,79,.22), transparent 18%); pointer-events:none; }
.icon-wrap { position:relative; z-index:1; width:58px; height:58px; border-radius:20px; display:grid; place-items:center; background:rgba(255,255,255,.72); border:1px solid rgba(16,32,51,.12); }
.icon-wrap span { font-family:Georgia, serif; font-size:34px; font-weight:700; }
.copy { position:relative; z-index:1; }
.copy b { display:block; font-size:19px; letter-spacing:-.02em; }
.copy small { display:block; color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
.arrow { position:absolute; z-index:1; right:18px; bottom:16px; width:36px; height:36px; border-radius:999px; display:grid; place-items:center; background:rgba(255,255,255,.68); border:1px solid rgba(119,221,231,.55); font-weight:900; }
.nav-card:hover { transform:translateY(-2px); box-shadow:0 20px 44px rgba(42,75,110,.18); }
@media (max-width: 780px) { .grid { grid-template-columns:repeat(2,1fr); } .header-line { display:none; } }
</style>
</head>
<body>
<section class="life-os">
  <div class="header"><div><div class="kicker">Life Planner OS</div><div class="title">Life OS Navigation</div></div><div class="header-line"></div></div>
  <div class="grid">
    <a class="nav-card" href="#" aria-label="Open Command Center">
      <div class="icon-wrap"><span>C</span></div>
      <div class="copy"><b>Command Center</b><small>Today • Week • Quick Capture</small></div>
      <div class="arrow">→</div>
    </a><a class="nav-card" href="#" aria-label="Open Action Hub">
      <div class="icon-wrap"><span>A</span></div>
      <div class="copy"><b>Action Hub</b><small>Tasks • Projects • Goals</small></div>
      <div class="arrow">→</div>
    </a><a class="nav-card" href="#" aria-label="Open Wellness + Routines">
      <div class="icon-wrap"><span>W</span></div>
      <div class="copy"><b>Wellness + Routines</b><small>Habits • Health • Reviews</small></div>
      <div class="arrow">→</div>
    </a><a class="nav-card" href="#" aria-label="Open Second Brain">
      <div class="icon-wrap"><span>B</span></div>
      <div class="copy"><b>Second Brain</b><small>Notes • Ideas • Resources</small></div>
      <div class="arrow">→</div>
    </a>
  </div>
</section>
</body>
</html>
