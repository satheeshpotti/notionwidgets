<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='../assets/theme.css'></head><body><div class='widget'><div class='content'><div class='row'><div><div class='kicker'>Life Planner OS</div><div id='time' class='big'>--:--</div><div id='date' class='muted small'></div></div><div class='pill'><span class='spark'></span> Focus</div></div><div style='height:14px'></div><div class='bar'><div class='fill' id='daybar' style='width:0%'></div></div><div class='row small muted' style='margin-top:8px'><span>Day progress</span><span id='pct'>0%</span></div></div></div><script>function tick(){const d=new Date();let h=d.getHours(),m=d.getMinutes();document.getElementById('time').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const pct=((h*60+m)/1440*100);document.getElementById('daybar').style.width=pct+'%';document.getElementById('pct').textContent=Math.round(pct)+'%';}tick();setInterval(tick,10000)</script></body></html>
