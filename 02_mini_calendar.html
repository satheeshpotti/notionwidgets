<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='../assets/theme.css'><style>.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{padding:7px 0;border-radius:10px;font-size:12px}.head{font-size:10px;font-weight:850;color:#5E7A94}.today{background:linear-gradient(135deg,var(--mint),var(--sky));font-weight:900}.dim{opacity:.32}</style></head><body><div class='widget'><div class='content'><div class='row'><button id='prev' class='pill' style='border:0'>‹</button><div style='text-align:center'><div id='month' class='title' style='margin:0'></div><div class='kicker'>Monthly Map</div></div><button id='next' class='pill' style='border:0'>›</button></div><div class='cal' id='cal' style='margin-top:12px'></div></div></div><script>let view=new Date();function draw(){const cal=document.getElementById('cal');cal.innerHTML='';const y=view.getFullYear(),m=view.getMonth();document.getElementById('month').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(x=>cal.innerHTML+=`<div class='head'>${x}</div>`);let first=(new Date(y,m,1).getDay()+6)%7;let days=new Date(y,m+1,0).getDate();let prev=new Date(y,m,0).getDate();for(let i=0;i<42;i++){let n=i-first+1, cls='day', label=n;if(n<1){label=prev+n;cls+=' dim'} else if(n>days){label=n-days;cls+=' dim'} const t=new Date(); if(n===t.getDate()&&m===t.getMonth()&&y===t.getFullYear())cls+=' today'; cal.innerHTML+=`<div class='${cls}'>${label}</div>`}}draw();prev.onclick=()=>{view.setMonth(view.getMonth()-1);draw()};next.onclick=()=>{view.setMonth(view.getMonth()+1);draw()}</script></body></html>
